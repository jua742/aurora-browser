name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fail if secrets are tracked by git
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)local\.properties$|\.jks$|\.keystore$' || true)
          if [ -n "$TRACKED" ]; then
            echo "ERROR: secret files are tracked by git:"
            echo "$TRACKED"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Diagnose environment
        run: |
          echo "## Environment diagnostics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_STEP_SUMMARY
          java -version 2>&1 | head -3 >> $GITHUB_STEP_SUMMARY
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_STEP_SUMMARY
          echo "--- platforms ---" >> $GITHUB_STEP_SUMMARY
          ls "$ANDROID_HOME/platforms/" 2>&1 >> $GITHUB_STEP_SUMMARY
          echo "--- gradle version ---" >> $GITHUB_STEP_SUMMARY
          gradle --version 2>&1 | head -12 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build debug APK
        id: build
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle assembleDebug --stacktrace > /tmp/build.log 2>&1; echo "exit=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Publish build log to summary
        if: always()
        run: |
          echo "## Build result" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: ${{ steps.build.outputs.exit }}" >> $GITHUB_STEP_SUMMARY
          echo "### Last 80 lines of build log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build.outputs.exit }}" != "0" ]; then
            echo "BUILD FAILED (see log above)"
            exit 1
          fi
          echo "BUILD SUCCEEDED"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
